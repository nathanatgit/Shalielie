name: StylePort Apple Build

on:
  push:
    paths:
      - "swiftPort/**"
      - ".github/workflows/swift-port.yml"
  pull_request:
    paths:
      - "swiftPort/**"
      - ".github/workflows/swift-port.yml"
  workflow_dispatch:

jobs:
  apple-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: swiftPort
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build macOS app
        run: >-
          xcodebuild -project StylePort.xcodeproj -scheme StylePort
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/StylePort-macOS"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build universal iOS and iPadOS simulator app
        run: >-
          xcodebuild -project StylePort.xcodeproj -scheme StylePort
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/StylePort-iOS-Simulator"
          CODE_SIGNING_ALLOWED=NO build
      - name: Run Xcode unit tests on macOS
        run: >-
          xcodebuild -project StylePort.xcodeproj -scheme StylePort
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/StylePort-macOS"
          CODE_SIGNING_ALLOWED=NO test
      - name: Run Swift package tests
        run: swift test
      - name: Package unsigned app bundles
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/StylePort-artifacts"
          mkdir -p "$artifact_root/macos" "$artifact_root/ios-simulator"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/StylePort-macOS/Build/Products/Debug/StylePort.app" \
            "$artifact_root/macos/StylePort-macOS-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/StylePort-iOS-Simulator/Build/Products/Debug-iphonesimulator/StylePort.app" \
            "$artifact_root/ios-simulator/StylePort-iOS-Simulator-unsigned.zip"
          (
            cd "$artifact_root/macos"
            shasum -a 256 StylePort-macOS-unsigned.zip > SHA256SUMS.txt
          )
          (
            cd "$artifact_root/ios-simulator"
            shasum -a 256 StylePort-iOS-Simulator-unsigned.zip > SHA256SUMS.txt
          )
      - name: Upload unsigned macOS app
        uses: actions/upload-artifact@v7
        with:
          name: StylePort-macOS-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/StylePort-artifacts/macos
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned iOS and iPadOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: StylePort-iOS-Simulator-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/StylePort-artifacts/ios-simulator
          if-no-files-found: error
          retention-days: 14
