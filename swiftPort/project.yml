name: StylePort
options:
  bundleIdPrefix: com.nathanhanapps
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StylePortCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/StylePortCore
      - path: Resources/Profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport.core
        PRODUCT_NAME: StylePortCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  StylePort:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Sources/StylePortApp
        excludes:
          - Info.plist
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj
      - path: Resources/zh-Hans.lproj
    dependencies:
      - target: StylePortCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport
        PRODUCT_NAME: StylePort
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/StylePortApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Shalielie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Shalielie reads the original HEIC and Live Photo video of the photos you style, and replaces them when you ask it to.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Shalielie saves the styled photos to your library.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  StylePortCoreTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/StylePortCoreTests
    dependencies:
      - target: StylePortCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport.coretests
schemes:
  StylePort:
    build:
      targets:
        StylePort: all
        StylePortCoreTests: [test]
    test:
      targets:
        - StylePortCoreTests
