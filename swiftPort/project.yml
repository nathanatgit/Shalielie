name: StylePort
options:
  bundleIdPrefix: com.nathanhanapps
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  StylePortCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/StylePortCore
      - path: Resources/Profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport.core
        PRODUCT_NAME: StylePortCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  StylePort:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Sources/StylePortApp
        excludes:
          - Info.plist
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj
      - path: Resources/zh-Hans.lproj
    dependencies:
      - target: StylePortCore
        embed: true
      - target: StylePortShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport
        PRODUCT_NAME: StylePort
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/StylePortApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Palettify
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Palettify reads the original HEIC and Live Photo video of the photos you style, and replaces them when you ask it to.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Palettify saves the styled photos to your library.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  StylePortShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Sources/StylePortShare
        excludes:
          - Info.plist
      # The queue and what it needs, shared with the app.
      - path: Sources/StylePortApp/AppSettings.swift
      - path: Sources/StylePortApp/BackupStore.swift
      - path: Sources/StylePortApp/JobRow.swift
      - path: Sources/StylePortApp/LivePhotoStyler.swift
      - path: Sources/StylePortApp/ModernUI.swift
      - path: Sources/StylePortApp/PhotoLibraryService.swift
      - path: Sources/StylePortApp/PortQueue.swift
      - path: Sources/StylePortApp/PrivacyInfo.xcprivacy
      - path: Resources/Localizable.xcstrings
      - path: Resources/en.lproj
      - path: Resources/zh-Hans.lproj
    dependencies:
      - target: StylePortCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport.share
        PRODUCT_NAME: StylePortShare
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/StylePortShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Palettify
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Palettify reads the original HEIC and Live Photo video of the photos you style, and replaces them when you ask it to.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Palettify saves the styled photos to your library.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  StylePortCoreTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/StylePortCoreTests
    dependencies:
      - target: StylePortCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhanapps.styleport.coretests
schemes:
  StylePort:
    build:
      targets:
        StylePort: all
        StylePortCoreTests: [test]
    test:
      targets:
        - StylePortCoreTests
